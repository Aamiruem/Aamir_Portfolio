<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-label="Workspace illustration: dual-monitor data analytics dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06222B"/><stop offset="1" stop-color="#0B1238"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".35" r=".6"><stop offset="0" stop-color="#14B8A6" stop-opacity=".4"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".5"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050A1A" stop-opacity="0"/><stop offset=".45" stop-color="#050A1A" stop-opacity=".9"/></linearGradient>
  </defs>
  <rect width="640" height="800" fill="url(#bg)"/>
  <rect width="640" height="800" fill="url(#glow)"/>
  <!-- left monitor: line + bars -->
  <g transform="rotate(-4 180 300)">
    <rect x="30" y="170" width="300" height="230" rx="14" fill="#04101A" stroke="#1E5A66" stroke-width="3"/>
    <rect x="42" y="182" width="276" height="206" rx="8" fill="#0A1A2A"/>
    <text x="56" y="206" fill="#99F6E4" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Sales trend</text>
    <path d="M56 340 L96 318 L136 326 L176 290 L216 300 L256 262 L296 270 L296 370 L56 370 Z" fill="url(#area)"/>
    <path d="M56 340 L96 318 L136 326 L176 290 L216 300 L256 262 L296 270" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <g fill="#5EEAD4"><circle cx="176" cy="290" r="4"/><circle cx="256" cy="262" r="4"/></g>
    <g stroke="#123040"><line x1="56" y1="240" x2="300" y2="240"/><line x1="56" y1="290" x2="300" y2="290"/><line x1="56" y1="340" x2="300" y2="340"/></g>
  </g>
  <!-- right monitor: donut + kpis -->
  <g transform="rotate(4 460 300)">
    <rect x="310" y="170" width="300" height="230" rx="14" fill="#04101A" stroke="#3B4C8F" stroke-width="3"/>
    <rect x="322" y="182" width="276" height="206" rx="8" fill="#0D1330"/>
    <text x="336" y="206" fill="#C7D2FE" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Customer segments</text>
    <circle cx="400" cy="296" r="54" fill="none" stroke="#1E2A5A" stroke-width="22"/>
    <circle cx="400" cy="296" r="54" fill="none" stroke="#818CF8" stroke-width="22" stroke-dasharray="150 340" transform="rotate(-90 400 296)"/>
    <circle cx="400" cy="296" r="54" fill="none" stroke="#F472B6" stroke-width="22" stroke-dasharray="90 340" stroke-dashoffset="-150" transform="rotate(-90 400 296)"/>
    <circle cx="400" cy="296" r="54" fill="none" stroke="#FBBF24" stroke-width="22" stroke-dasharray="60 340" stroke-dashoffset="-240" transform="rotate(-90 400 296)"/>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#CBD5E1">
      <rect x="480" y="252" width="10" height="10" rx="2" fill="#818CF8"/><text x="496" y="261">Loyal</text>
      <rect x="480" y="280" width="10" height="10" rx="2" fill="#F472B6"/><text x="496" y="289">New</text>
      <rect x="480" y="308" width="10" height="10" rx="2" fill="#FBBF24"/><text x="496" y="317">At risk</text>
    </g>
  </g>
  <rect x="160" y="404" width="24" height="60" fill="#132238"/><rect x="456" y="404" width="24" height="60" fill="#132238"/>
  <!-- laptop with bars -->
  <rect x="170" y="440" width="300" height="170" rx="12" fill="#070C20" stroke="#2A3566" stroke-width="3"/>
  <rect x="182" y="452" width="276" height="146" rx="6" fill="#0F1736"/>
  <text x="196" y="474" fill="#FDE68A" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700">Revenue by region</text>
  <g fill="#38BDF8"><rect x="200" y="540" width="28" height="44" rx="3"/><rect x="242" y="512" width="28" height="72" rx="3"/><rect x="284" y="526" width="28" height="58" rx="3"/><rect x="326" y="496" width="28" height="88" rx="3"/><rect x="368" y="520" width="28" height="64" rx="3"/><rect x="410" y="504" width="28" height="80" rx="3"/></g>
  <path d="M140 610 h360 l20 18 h-400 z" fill="#1A2350"/>
  <!-- caption -->
  <rect x="0" y="560" width="640" height="240" fill="url(#cap)"/>
  <text x="320" y="690" fill="#FFFFFF" font-family="Georgia,serif" font-size="34" text-anchor="middle">Turning data into insight</text>
  <text x="320" y="724" fill="#5EEAD4" font-family="Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="2" text-anchor="middle">SQL · PANDAS · POWER BI</text>
</svg>
